name: SkyHawk [SHRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: 'SHRP Manifest'
        required: true
        default: 'https://github.com/SHRP-Reborn/manifest.git'
        type: string

      MANIFEST_BRANCH:
        description: 'SHRP Manifest Branch'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
          - shrp-12.1
          - shrp-9.0

      BUILD_TARGET:
        description: 'Build Target(s) — separados por coma: recovery,boot,vendor_boot'
        required: true
        default: 'recovery'
        type: string

      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: false
        type: boolean

      LDCHECKPATH:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'
        type: string


# ================================================================
# GLOBAL PERMISSIONS
# ================================================================

permissions:
  contents: write


# ================================================================
# JOBS
# ================================================================

jobs:

  # ================================================================
  # PREPARE MATRIX
  # ================================================================

  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-22.04

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:

      - name: Build matrix JSON
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          raw="${{ inputs.BUILD_TARGET }}"

          if [ -z "$raw" ]; then
            raw="recovery"
          fi

          IFS=',' read -ra TARGETS <<< "$raw"

          json='['
          first=true

          for target in "${TARGETS[@]}"; do

            target="$(echo "$target" | xargs)"

            if [ -z "$target" ]; then
              continue
            fi

            case "$target" in
              recovery|boot|vendor_boot)
                ;;
              *)
                echo "::error::Invalid build target: $target"
                echo "::error::Valid targets: recovery, boot, vendor_boot"
                exit 1
                ;;
            esac

            if [ "$first" = true ]; then
              json="${json}\"${target}\""
              first=false
            else
              json="${json},\"${target}\""
            fi

          done

          json="${json}]"

          if [ "$json" = "[]" ]; then
            echo "::error::No valid build targets were specified."
            exit 1
          fi

          echo "matrix={\"target\":${json}}" >> "$GITHUB_OUTPUT"

          echo "::notice::Build matrix: ${json}"


  # ================================================================
  # BUILD
  # ================================================================

  build:
    name: 🛠️ Build ${{ matrix.target }} — ${{ github.actor }}

    needs:
      - prepare-matrix

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false

      matrix:
        target: ${{ fromJson(needs.prepare-matrix.outputs.matrix).target }}

    env:

      # ============================================================
      # DEVICE TREE
      # ============================================================

      DEVICE_TREE: https://github.com/christiandroid20/shrp_device_samsung_a35x.git
      DEVICE_TREE_BRANCH: a35-recovery-test

      # ============================================================
      # YOUR FORK OF BOOTABLE/RECOVERY
      # ============================================================

      RECOVERY_CORE: https://github.com/christiandroid20/shrp_android_bootable_recovery.git
      RECOVERY_CORE_BRANCH: android-12.1

      # ============================================================
      # EXPECTED SECURITY PATCH
      # ============================================================

      EXPECTED_VENDOR_SECURITY_PATCH: "2025-04-01"

      # ============================================================
      # BUILD OPTIONS
      # ============================================================

      ALLOW_MISSING_DEPENDENCIES: true

    steps:

      # ============================================================
      # CHECKOUT WORKFLOW REPOSITORY
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DISPLAY CONFIGURATION
      # ============================================================

      - name: 📋 Display build configuration
        shell: bash
        run: |
          echo "=========================================="
          echo " SKYHAWK SHRP BUILD"
          echo "=========================================="

          echo "Manifest:"
          echo "${{ inputs.MANIFEST }}"

          echo ""
          echo "Manifest branch:"
          echo "${{ inputs.MANIFEST_BRANCH }}"

          echo ""
          echo "Device tree:"
          echo "${DEVICE_TREE}"

          echo ""
          echo "Device tree branch:"
          echo "${DEVICE_TREE_BRANCH}"

          echo ""
          echo "Recovery core:"
          echo "${RECOVERY_CORE}"

          echo ""
          echo "Recovery core branch:"
          echo "${RECOVERY_CORE_BRANCH}"

          echo ""
          echo "Build target:"
          echo "${{ matrix.target }}image"

          echo ""
          echo "LDCheck:"
          echo "${{ inputs.LDCHECK }}"

          echo ""
          echo "=========================================="


      # ============================================================
      # CLEAN RUNNER
      # ============================================================

      - name: 🧹 Slim runner
        uses: rokibhasansagar/slimhub_actions@main


      # ============================================================
      # SWAP
      # ============================================================

      - name: 💾 Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: 📦 Prepare build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "::notice::📦 Installing build dependencies..."

          sudo apt-get update

          sudo apt-get install -y \
            gperf \
            gcc-multilib \
            g++-multilib \
            libc6-dev \
            x11proto-core-dev \
            libx11-dev \
            tree \
            lib32z-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            ccache \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libxml2 \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            imagemagick \
            libbz2-dev \
            lzma \
            ncftp \
            qemu-user-static \
            zip \
            unzip \
            flex \
            bison \
            gawk \
            expat \
            texinfo \
            gpg \
            gnupg2 \
            python3-dev \
            pkg-config \
            libssl-dev \
            gcc \
            curl \
            git \
            rsync \
            unzip \
            zip

          echo "::notice::✅ Base dependencies installed"


      # ============================================================
      # LEGACY UBUNTU PACKAGES
      # ============================================================

      - name: 📦 Install legacy build libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "::notice::Installing legacy Ubuntu libraries..."

          FOCAL_LIST="/etc/apt/sources.list.d/shrp-focal.list"

          echo "deb http://archive.ubuntu.com/ubuntu focal main universe" |
            sudo tee "$FOCAL_LIST" >/dev/null

          sudo apt-get update

          sudo apt-get install -y \
            libtinfo5 \
            libncurses5 \
            libncurses5-dev \
            lib32ncurses5-dev \
            python2.7 \
            python2.7-minimal \
            python2.7-dev

          sudo rm -f "$FOCAL_LIST"

          sudo apt-get update

          echo "::notice::✅ Legacy libraries installed"


      # ============================================================
      # PYTHON 2
      # ============================================================

      - name: 🐍 Configure Python 2.7
        if: inputs.MANIFEST_BRANCH == 'shrp-12.1'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -x /usr/bin/python2.7 ]; then
            echo "::error::Python 2.7 was not installed."
            exit 1
          fi

          sudo update-alternatives \
            --install /usr/bin/python2 python2 /usr/bin/python2.7 1

          echo "Python 2.7:"
          /usr/bin/python2.7 --version

          echo "Python 2:"
          python2 --version

          echo "::notice::✅ Python 2.7 ready"


      # ============================================================
      # JAVA
      # ============================================================

      - name: ☕ Install OpenJDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'


      # ============================================================
      # REPO TOOL
      # ============================================================

      - name: 📂 Install Git Repo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          sudo ln -sf "$HOME/bin/repo" /usr/bin/repo

          repo --version

          echo "::notice::✅ repo installed"


      # ============================================================
      # INITIALIZE REPO
      # ============================================================

      - name: 🔧 Initialize SHRP repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-recovery

          cd android-recovery

          git config --global user.name "lazycodebuilder"
          git config --global user.email \
            "154446636+lazycodebuilder@users.noreply.github.com"

          repo init \
            --depth=1 \
            -u "${{ inputs.MANIFEST }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

          echo "::notice::✅ SHRP repository initialized"


      # ============================================================
      # SYNC
      # ============================================================

      - name: 🔄 Sync SHRP repositories
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          echo "::notice::🔄 Synchronizing SHRP..."

          repo sync \
            -j"$(nproc)" \
            --force-sync \
            --no-clone-bundle \
            --current-branch \
            --optimized-fetch \
            --prune

          echo "::notice::✅ SHRP sync complete"


      # ============================================================
      # INSTALL YOUR RECOVERY FORK
      # ============================================================

      - name: 🔄 Install custom bootable/recovery fork
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          echo "=========================================="
          echo " CUSTOM RECOVERY CORE"
          echo "=========================================="

          echo "Repository:"
          echo "${RECOVERY_CORE}"

          echo "Branch:"
          echo "${RECOVERY_CORE_BRANCH}"

          echo ""

          # Remove recovery supplied by manifest.
          rm -rf bootable/recovery

          mkdir -p bootable

          # Clone YOUR fork directly into bootable/recovery.
          git clone \
            --depth=1 \
            --branch "${RECOVERY_CORE_BRANCH}" \
            "${RECOVERY_CORE}" \
            bootable/recovery

          echo ""
          echo "Recovery repository:"
          git -C bootable/recovery remote -v

          echo ""
          echo "Recovery branch:"
          git -C bootable/recovery branch --show-current

          echo ""
          echo "Recovery commit:"
          git -C bootable/recovery rev-parse HEAD

          echo ""
          echo "::notice::✅ Your bootable/recovery fork is installed"


      # ============================================================
      # CLONE DEVICE TREE
      # ============================================================

      - name: 📱 Clone A35X device tree
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          rm -rf device_tree

          git clone \
            --depth=1 \
            --branch "${DEVICE_TREE_BRANCH}" \
            "${DEVICE_TREE}" \
            device_tree

          cd device_tree

          COMMIT_ID="$(git rev-parse HEAD)"

          echo "COMMIT_ID=${COMMIT_ID}" >> "$GITHUB_ENV"

          echo "::notice::Device tree commit: ${COMMIT_ID}"

          cd ..

          echo "::notice::✅ A35X device tree cloned"


      # ============================================================
      # EXTRACT DEVICE CONFIGURATION
      # ============================================================

      - name: 🔍 Extract device configuration
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery/device_tree

          DEVICE_MAKEFILE=""
          DEVICE_DIRECTORY=""
          DEVICE_NAME=""

          shopt -s nullglob

          # Search recursively because Android device trees may keep the
          # product makefile at the repository root or in a subdirectory.
          PRODUCT_FILE_FOUND=""

          while IFS= read -r -d '' file; do

            PRODUCT_NAME_VALUE="$(
              sed -n                 's/^[[:space:]]*PRODUCT_NAME[[:space:]]*[:?+]*=[[:space:]]*\(.*\)/\1/p'                 "$file" |
                head -n1 |
                sed 's/[[:space:]]*$//'
            )"

            PRODUCT_DEVICE_VALUE="$(
              sed -n                 's/^[[:space:]]*PRODUCT_DEVICE[[:space:]]*[:?+]*=[[:space:]]*\(.*\)/\1/p'                 "$file" |
                head -n1 |
                sed 's/[[:space:]]*$//'
            )"

            PRODUCT_BRAND_VALUE="$(
              sed -n                 's/^[[:space:]]*PRODUCT_BRAND[[:space:]]*[:?+]*=[[:space:]]*\(.*\)/\1/p'                 "$file" |
                head -n1 |
                sed 's/[[:space:]]*$//'
            )"

            if [[ -n "$PRODUCT_NAME_VALUE" &&
                  -n "$PRODUCT_DEVICE_VALUE" ]]; then

              DEVICE_MAKEFILE="$PRODUCT_NAME_VALUE"
              DEVICE_NAME="$PRODUCT_DEVICE_VALUE"

              if [[ -n "$PRODUCT_BRAND_VALUE" ]]; then
                DEVICE_DIRECTORY="device/$PRODUCT_BRAND_VALUE"
              else
                DEVICE_DIRECTORY="device/samsung"
                echo "::notice::PRODUCT_BRAND not found; using device/samsung"
              fi

              PRODUCT_FILE_FOUND="$file"
              break
            fi

          done < <(
            find .               -type f               -name "*.mk"               -not -path "./.git/*"               -print0 |
            sort -z
          )

          if [[ -z "$PRODUCT_FILE_FOUND" ]]; then
            echo "::error::❌ Could not find a product makefile containing PRODUCT_NAME and PRODUCT_DEVICE."
            echo ""
            echo "Available makefiles:"
            find .               -type f               -name "*.mk"               -not -path "./.git/*"               -print |
              sort
            exit 1
          fi

          echo "::notice::Product makefile detected: $PRODUCT_FILE_FOUND"

          if [ -z "$DEVICE_MAKEFILE" ]; then
            echo "::error::❌ PRODUCT_NAME could not be detected."
            exit 1
          fi

          if [ -z "$DEVICE_DIRECTORY" ]; then
            echo "::error::❌ Device directory could not be detected."
            exit 1
          fi

          if [ -z "$DEVICE_NAME" ]; then
            echo "::error::❌ Device codename could not be detected."
            exit 1
          fi

          echo "DEVICE_MAKEFILE=${DEVICE_MAKEFILE}" >> "$GITHUB_ENV"
          echo "DEVICE_NAME=${DEVICE_NAME}" >> "$GITHUB_ENV"
          echo "DEVICE_DIRECTORY=${DEVICE_DIRECTORY}" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo " DEVICE DETECTED"
          echo "=========================================="

          echo "PRODUCT_NAME: ${DEVICE_MAKEFILE}"
          echo "PRODUCT_BRAND: ${DEVICE_DIRECTORY#device/}"
          echo "PRODUCT_DEVICE: ${DEVICE_NAME}"

          cd ..

          mkdir -p "$DEVICE_DIRECTORY"

          rm -rf "$DEVICE_DIRECTORY/$DEVICE_NAME"

          mv device_tree \
            "$DEVICE_DIRECTORY/$DEVICE_NAME"

          echo "::notice::✅ Device tree installed at:"
          echo "$DEVICE_DIRECTORY/$DEVICE_NAME"


      # ================================================================
      # VALIDATE DEVICE TREE
      # ================================================================

      - name: 🔎 Validate device tree
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          DEVICE_PATH="$DEVICE_DIRECTORY/$DEVICE_NAME"

          echo "=========================================="
          echo " DEVICE TREE VALIDATION"
          echo "=========================================="

          echo "DEVICE_PATH=${DEVICE_PATH}"
          echo "DEVICE_NAME=${DEVICE_NAME}"
          echo "DEVICE_DIRECTORY=${DEVICE_DIRECTORY}"
          echo "DEVICE_MAKEFILE=${DEVICE_MAKEFILE}"

          if [ ! -d "$DEVICE_PATH" ]; then
            echo "::error::❌ Device tree does not exist."
            exit 1
          fi

          if [ ! -f "$DEVICE_PATH/AndroidProducts.mk" ]; then
            echo "::error::❌ AndroidProducts.mk is missing."
            exit 1
          fi

          echo "::notice::✅ AndroidProducts.mk found"

          echo ""
          echo "Product files:"

          find "$DEVICE_PATH" \
            -maxdepth 2 \
            -type f \
            -name "*.mk" \
            -print \
            | sort


      # ================================================================
      # ENSURE VENDORSETUP
      # ================================================================

      - name: 🔧 Ensure vendorsetup.sh
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          DEVICE_PATH="$DEVICE_DIRECTORY/$DEVICE_NAME"

          if [ -f "$DEVICE_PATH/vendorsetup.sh" ]; then

            echo "::notice::✅ vendorsetup.sh already exists"

          else

            echo "::warning::vendorsetup.sh missing."
            echo "::notice::Creating compatibility vendorsetup.sh"

            echo "add_lunch_combo ${DEVICE_MAKEFILE}-eng" > "$DEVICE_PATH/vendorsetup.sh"

            chmod +x "$DEVICE_PATH/vendorsetup.sh"

            echo "::notice::✅ vendorsetup.sh created"

          fi

          cat "$DEVICE_PATH/vendorsetup.sh"


      # ================================================================
      # ================================================================
      # PRUNE OPTIONAL CAMERA / NPU / VIDEO MODULES FOR RECOVERY
      # ================================================================

      - name: ✂️ Prune non-recovery camera and accelerator modules
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery
          MODULE_DIR="${DEVICE_DIRECTORY}/${DEVICE_NAME}/recovery/root/lib/modules"

          if [ ! -d "$MODULE_DIR" ]; then
            echo "::error::Recovery module directory not found: $MODULE_DIR"
            exit 1
          fi

          # Recovery does not use camera capture, ISP tuning, NPU, or the
          # hardware video codec. Keep display, touchscreen, USB, Wi-Fi,
          # storage, fingerprint, TEE and encryption-related modules.
          # fimc-is.ko define camera_class y is-flash-sm5714.ko lo importa (ruta de la
          # linterna /sys/devices/virtual/camera/flash). Ellos y sus dependencias
          # (pablo-hws/libs/icpu/smc, votf) se conservan como en BUILD A.
          EXCLUDED_MODULES=(
            is-cis-3l6.ko
            is-cis-gn8.ko
            is-cis-imx882.ko
            is-cis-hi1339.ko
            is-cis-gc05a3.ko
            is-cis-gc08a3.ko
            is-actuator-ak737x.ko
            pablo-self-tests.ko
            is-device-eeprom.ko
            is-device-otprom.ko
            smfc.ko
            scaler.ko
            gdc.ko
            npu.ko
            exynos_mfc.ko
          )

          EXCLUDED_LIST="$(mktemp)"
          for module in "${EXCLUDED_MODULES[@]}"; do
            if [ -f "$MODULE_DIR/$module" ]; then
              printf '%s\n' "$module" >> "$EXCLUDED_LIST"
              echo "Removing optional module: $module"
              rm -f "$MODULE_DIR/$module"
            else
              echo "::warning::Optional module not present: $module"
            fi
          done

          if [ -f "$MODULE_DIR/modules.load.recovery" ]; then
            grep -Fvx -f "$EXCLUDED_LIST" "$MODULE_DIR/modules.load.recovery" \
              > "$MODULE_DIR/modules.load.recovery.tmp" || true
            mv "$MODULE_DIR/modules.load.recovery.tmp" "$MODULE_DIR/modules.load.recovery"
          fi

          if [ -f "$MODULE_DIR/modules.dep" ]; then
            awk -v list="$EXCLUDED_LIST" '
              BEGIN {
                while ((getline m < list) > 0) excluded["/lib/modules/" m] = 1
              }
              {
                colon = index($0, ":")
                if (!colon) { print; next }
                target = substr($0, 1, colon - 1)
                if (target in excluded) next
                rest = substr($0, colon + 1)
                count = split(rest, deps, /[[:space:]]+/)
                output = target ":"
                for (i = 1; i <= count; i++) {
                  if (deps[i] != "" && !(deps[i] in excluded)) output = output " " deps[i]
                }
                sub(/[[:space:]]+$/, "", output)
                print output
              }
            ' "$MODULE_DIR/modules.dep" > "$MODULE_DIR/modules.dep.tmp"
            mv "$MODULE_DIR/modules.dep.tmp" "$MODULE_DIR/modules.dep"
          fi

          if [ -f "$MODULE_DIR/modules.alias" ]; then
            awk -v list="$EXCLUDED_LIST" '
              BEGIN {
                while ((getline m < list) > 0) {
                  sub(/\.ko$/, "", m)
                  gsub(/-/, "_", m)
                  excluded[m] = 1
                }
              }
              /^#/ { print; next }
              NF >= 3 && ($NF in excluded) { next }
              { print }
            ' "$MODULE_DIR/modules.alias" > "$MODULE_DIR/modules.alias.tmp"
            mv "$MODULE_DIR/modules.alias.tmp" "$MODULE_DIR/modules.alias"
          fi

          if [ -f "$MODULE_DIR/modules.softdep" ]; then
            awk -v list="$EXCLUDED_LIST" '
              BEGIN {
                while ((getline m < list) > 0) {
                  sub(/\.ko$/, "", m)
                  gsub(/-/, "_", m)
                  excluded[m] = 1
                }
              }
              /^#/ { print; next }
              {
                skip = 0
                for (i = 1; i <= NF; i++) {
                  token = $i
                  sub(/:$/, "", token)
                  gsub(/-/, "_", token)
                  if (token in excluded) skip = 1
                }
                if (!skip) print
              }
            ' "$MODULE_DIR/modules.softdep" > "$MODULE_DIR/modules.softdep.tmp"
            mv "$MODULE_DIR/modules.softdep.tmp" "$MODULE_DIR/modules.softdep"
          fi

          rm -f "$EXCLUDED_LIST"

          echo "Remaining module files: $(find "$MODULE_DIR" -maxdepth 1 -type f -name '*.ko' | wc -l)"
          echo "Remaining recovery load entries: $(wc -l < "$MODULE_DIR/modules.load.recovery")"
          echo "::notice::Optional camera/ISP/NPU/video modules pruned; touch, display, USB, storage and TEE modules preserved"


      # VERIFY PRODUCT MAKEFILE
      # ================================================================

      - name: 🧪 Verify product makefile
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          DEVICE_PATH="$DEVICE_DIRECTORY/$DEVICE_NAME"
          PRODUCT_FILE="$DEVICE_PATH/${DEVICE_MAKEFILE}.mk"

          echo "Expected product:"
          echo "$PRODUCT_FILE"

          if [ ! -f "$PRODUCT_FILE" ]; then
            PRODUCT_FILE="$(
              find "$DEVICE_PATH"                 -maxdepth 2                 -type f                 -name "*.mk"                 -exec grep -l                   -m1                   "PRODUCT_NAME[[:space:]]*[:?+]*=[[:space:]]*${DEVICE_MAKEFILE}"                   {} + |
                head -n1 || true
            )"
          fi

          if [ -z "$PRODUCT_FILE" ] || [ ! -f "$PRODUCT_FILE" ]; then
            echo "::error::❌ Product makefile not found for ${DEVICE_MAKEFILE}."

            echo ""
            echo "Available makefiles:"
            find "$DEVICE_PATH"               -maxdepth 2               -type f               -name "*.mk"               -print |
              sort

            exit 1
          fi

          echo "::notice::✅ Product makefile found:"
          echo "$PRODUCT_FILE"


      # ================================================================
      # FIX SYSTEM AND VENDOR SECURITY PATCH PROPERTIES
      # ================================================================
      #
      # BOARD_SECURITY_PATCH and VENDOR_SECURITY_PATCH are separate:
      # the former is used for the system patch level, the latter for
      # ro.vendor.build.security_patch. Keep both aligned to the A35
      # firmware patch level and remove the duplicate vendor.prop entry.

      - name: 🩹 Fix system and vendor security patch properties
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          DEVICE_PATH="$DEVICE_DIRECTORY/$DEVICE_NAME"
          BOARD_CONFIG="$DEVICE_PATH/BoardConfig.mk"

          VENDOR_PROP="$(
            find "$DEVICE_PATH" \
              -name "vendor.prop" \
              -print \
              -quit
          )"

          if [ -n "$VENDOR_PROP" ] && [ -f "$VENDOR_PROP" ]; then
            if grep -qE '^[[:space:]]*ro\.vendor\.build\.security_patch[[:space:]]*=' "$VENDOR_PROP"; then
              echo "::notice::Removing duplicate ro.vendor.build.security_patch from $VENDOR_PROP"
              sed -i '/^[[:space:]]*ro\.vendor\.build\.security_patch[[:space:]]*=/d' "$VENDOR_PROP"
            fi
          fi

          if [ ! -f "$BOARD_CONFIG" ]; then
            echo "::error::BoardConfig.mk not found: $BOARD_CONFIG"
            exit 1
          fi

          set_make_var() {
            local variable="$1"
            if grep -qE "^[[:space:]]*${variable}[[:space:]]*:=" "$BOARD_CONFIG"; then
              sed -i "s|^[[:space:]]*${variable}[[:space:]]*:=.*|${variable} := ${EXPECTED_VENDOR_SECURITY_PATCH}|" "$BOARD_CONFIG"
            else
              printf '\n%s := %s\n' "$variable" "$EXPECTED_VENDOR_SECURITY_PATCH" >> "$BOARD_CONFIG"
            fi
          }

          set_make_var BOARD_SECURITY_PATCH
          set_make_var VENDOR_SECURITY_PATCH

          echo "Resolved patch variables:"
          grep -nE '^[[:space:]]*(BOARD|VENDOR)_SECURITY_PATCH[[:space:]]*:=' "$BOARD_CONFIG"

          echo "::notice::System and vendor patch levels set to ${EXPECTED_VENDOR_SECURITY_PATCH}"


      # ================================================================
      # SYS PROP DIAGNOSTIC
      # ================================================================

      - name: 🔍 Detect duplicate security patch properties
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          echo "=========================================="
          echo " SECURITY PATCH DIAGNOSTIC"
          echo "=========================================="

          grep -Rns \
            --exclude-dir=.git \
            --exclude-dir=.repo \
            --exclude-dir=out \
            "ro.vendor.build.security_patch" \
            device \
            vendor \
            build \
            system \
            2>/dev/null || true


      # ================================================================
      # REMOVE ONLY EMPTY ASSIGNMENTS
      # ================================================================

      - name: 🛠️ Remove empty security patch assignments
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          FOUND=0

          while IFS= read -r -d '' file; do

            if grep -qE \
              '^[[:space:]]*ro\.vendor\.build\.security_patch[[:space:]]*=[[:space:]]*$' \
              "$file"; then

              echo "::warning::Empty security patch assignment:"
              echo "$file"

              sed -i \
                '/^[[:space:]]*ro\.vendor\.build\.security_patch[[:space:]]*=[[:space:]]*$/d' \
                "$file"

              FOUND=1

            fi

          done < <(
            find device vendor \
              -type f \
              \( \
                -name "*.prop" \
                -o -name "*.mk" \
                -o -name "*.bp" \
                -o -name "Makefile" \
              \) \
              -print0 \
              2>/dev/null
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "::notice::No empty security patch assignments found."
          else
            echo "::notice::✅ Empty assignments removed."
          fi


      # ================================================================
      # VALIDATE SECURITY PATCH
      # ================================================================

      - name: 🔐 Validate vendor security patch
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          DEVICE_PATH="$DEVICE_DIRECTORY/$DEVICE_NAME"

          VENDOR_PROP="$(
            find "$DEVICE_PATH" \
              -name "vendor.prop" \
              -print \
              -quit
          )"

          if [ -z "$VENDOR_PROP" ]; then
            echo "::warning::vendor.prop not found."
            exit 0
          fi

          echo "vendor.prop:"
          echo "$VENDOR_PROP"

          echo ""
          echo "Security patch entries:"

          grep -n \
            "security_patch" \
            "$VENDOR_PROP" \
            || true

          echo ""

          BOARD_CONFIG="$DEVICE_PATH/BoardConfig.mk"

          if grep -qE \
            "^[[:space:]]*BOARD_SECURITY_PATCH[[:space:]]*:=[[:space:]]*${EXPECTED_VENDOR_SECURITY_PATCH}[[:space:]]*$" \
            "$BOARD_CONFIG" 2>/dev/null; then

            echo "::notice::✅ Expected vendor security patch found (BOARD_SECURITY_PATCH)."

          else

            echo "::warning::Expected vendor security patch not found."

          fi


      # ================================================================
      # VALIDATE VENDOR SECURITY PATCH VARIABLE
      # ================================================================

      - name: 🔐 Validate VENDOR_SECURITY_PATCH
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery
          BOARD_CONFIG="$DEVICE_DIRECTORY/$DEVICE_NAME/BoardConfig.mk"

          if ! grep -qE \
            "^[[:space:]]*VENDOR_SECURITY_PATCH[[:space:]]*:=[[:space:]]*${EXPECTED_VENDOR_SECURITY_PATCH}[[:space:]]*$" \
            "$BOARD_CONFIG"; then
            echo "::error::VENDOR_SECURITY_PATCH does not match the expected A35 firmware patch."
            grep -nE '^[[:space:]]*VENDOR_SECURITY_PATCH[[:space:]]*:=' "$BOARD_CONFIG" || true
            exit 1
          fi

          echo "::notice::VENDOR_SECURITY_PATCH matches ${EXPECTED_VENDOR_SECURITY_PATCH}"


      # ================================================================
      # UNIQUE SOURCE PROPERTY CHECK
      # ================================================================

      - name: 🧪 Validate security patch uniqueness
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          mapfile -t DEFINITIONS < <(
            grep -Rhs \
              --exclude-dir=.git \
              --exclude-dir=.repo \
              --exclude-dir=out \
              "^ro\.vendor\.build\.security_patch[[:space:]]*=" \
              device \
              vendor \
              2>/dev/null |
            sort -u
          )

          echo "Definitions:"
          printf '%s\n' "${DEFINITIONS[@]}"

          NONEMPTY_COUNT=0

          for prop in "${DEFINITIONS[@]}"; do

            if [[ "$prop" =~ ^ro\.vendor\.build\.security_patch[[:space:]]*=[[:space:]]*$ ]]; then
              continue
            fi

            NONEMPTY_COUNT=$((NONEMPTY_COUNT + 1))

          done

          echo ""
          echo "Non-empty definitions: ${NONEMPTY_COUNT}"

          if [ "$NONEMPTY_COUNT" -gt 1 ]; then

            echo "::error::❌ Multiple non-empty security patch definitions detected."

            grep -Rns \
              --exclude-dir=.git \
              --exclude-dir=.repo \
              --exclude-dir=out \
              "ro.vendor.build.security_patch" \
              device \
              vendor \
              2>/dev/null || true

            exit 1
          fi

          echo "::notice::✅ Security patch source validation passed."


      # ================================================================
      # CLEAN BUILD OUTPUT
      # ================================================================

      - name: 🧹 Clean output
        shell: bash
        run: |
          set -euo pipefail

          cd android-recovery

          rm -rf out

          echo "::notice::✅ out/ cleaned"


      # ================================================================
      # LUNCH
      # ================================================================

      - name: 🍽️ Setup Lunch
        shell: bash
        run: |
          set -eo pipefail

          cd android-recovery

          export TOP="$PWD"

          DEVICE_PATH="$TOP/$DEVICE_DIRECTORY/$DEVICE_NAME"

          echo "TOP=$TOP"
          echo "DEVICE_PATH=$DEVICE_PATH"
          echo "DEVICE_NAME=$DEVICE_NAME"
          echo "DEVICE_MAKEFILE=$DEVICE_MAKEFILE"

          if [ ! -d "$DEVICE_PATH" ]; then
            echo "::error::❌ Device tree missing."
            exit 1
          fi

          if [ ! -f "$DEVICE_PATH/AndroidProducts.mk" ]; then
            echo "::error::❌ AndroidProducts.mk missing."
            exit 1
          fi

          if [ ! -f "$DEVICE_PATH/vendorsetup.sh" ]; then
            echo "::error::❌ vendorsetup.sh missing."
            exit 1
          fi

          echo "::notice::🔧 Loading build environment..."

          source "$TOP/build/envsetup.sh"

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "::notice::🍽️ Running lunch:"
          echo "${DEVICE_MAKEFILE}-eng"

          lunch "${DEVICE_MAKEFILE}-eng"

          echo "::notice::✅ Lunch configured successfully"


      # ================================================================
      # BUILD
      # ================================================================

      - name: 🔨 Build ${{ matrix.target }}.img
        shell: bash
        run: |
          set -o pipefail

          cd android-recovery

          export TOP="$PWD"
          export ALLOW_MISSING_DEPENDENCIES=true

          source "$TOP/build/envsetup.sh"

          lunch "${DEVICE_MAKEFILE}-eng"

          echo ""
          echo "=========================================="
          echo " BUILD"
          echo "=========================================="

          echo "Device: ${DEVICE_NAME}"
          echo "Target: ${{ matrix.target }}image"

          START_TIME=$(date +%s)

          set +e

          mka \
            "${{ matrix.target }}image" \
            -j"$(nproc --all)" \
            2>&1 |
            tee "${GITHUB_WORKSPACE}/shrp-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          END_TIME=$(date +%s)

          BUILD_TIME=$((END_TIME - START_TIME))

          if [ "$BUILD_STATUS" -ne 0 ]; then

            echo "::error::❌ Build failed."
            echo "::error::Exit code: ${BUILD_STATUS}"
            echo "::error::Build time: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"

            exit "$BUILD_STATUS"

          fi

          echo "::notice::✅ Build completed."
          echo "::notice::Build time: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"


      # ================================================================
      # GENERATED PROPERTIES
      # ================================================================

      - name: 🔎 Inspect generated properties
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEVICE_NAME:-}" ]; then
            echo "::warning::DEVICE_NAME no está definido (probablemente falló un step anterior a su detección). Saltando inspección."
            exit 0
          fi

          cd android-recovery

          PRODUCT_DIR="out/target/product/${DEVICE_NAME}"

          echo "=========================================="
          echo " GENERATED PROPERTIES"
          echo "=========================================="

          if [ -d "$PRODUCT_DIR" ]; then

            grep -Rns \
              --include="build.prop" \
              --include="*.prop" \
              "ro.vendor.build.security_patch" \
              "$PRODUCT_DIR" \
              2>/dev/null || true

          else

            echo "::warning::Product output directory does not exist."

          fi


      # ================================================================
      # DIAGNOSTICS
      # ================================================================

      - name: 🩺 Collect build diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          cd android-recovery

          echo "=========================================="
          echo " BUILD FAILURE DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "Last 250 lines of build log:"

          tail -n 250 \
            "${GITHUB_WORKSPACE}/shrp-build.log" \
            2>/dev/null || true

          echo ""
          echo "Security patch references:"

          grep -Rns \
            --exclude-dir=.git \
            --exclude-dir=.repo \
            --exclude-dir=out \
            "ro.vendor.build.security_patch" \
            device \
            vendor \
            build \
            system \
            2>/dev/null || true

          echo ""
          echo "Generated vendor/build.prop:"

          if [ -n "${DEVICE_NAME:-}" ] && [ -f "out/target/product/${DEVICE_NAME}/vendor/build.prop" ]; then

            grep -n \
              "security_patch" \
              "out/target/product/${DEVICE_NAME}/vendor/build.prop" \
              || true

          fi


      # ================================================================
      # RECOVERY SIZE DIAGNOSTICS (FAILURE ONLY)
      # ================================================================

      - name: 📏 Collect recovery image size details
        if: failure()
        shell: bash
        run: |
          set +e

          cd android-recovery
          PRODUCT_DIR="out/target/product/${DEVICE_NAME:-a35x}"
          REPORT="${GITHUB_WORKSPACE}/shrp-recovery-size-report.txt"

          {
            echo "SHRP recovery size diagnostics"
            echo "Device: ${DEVICE_NAME:-unknown}"
            echo "Device tree branch: ${DEVICE_TREE_BRANCH}"
            echo "Device tree commit: ${COMMIT_ID:-unknown}"
            echo "Expected vendor patch: ${EXPECTED_VENDOR_SECURITY_PATCH}"
            echo ""

            for file in \
              "$PRODUCT_DIR/recovery.img" \
              "$PRODUCT_DIR/kernel" \
              "$PRODUCT_DIR/ramdisk-recovery.img" \
              "$DEVICE_DIRECTORY/$DEVICE_NAME/prebuilt/dtb.img" \
              "$DEVICE_DIRECTORY/$DEVICE_NAME/prebuilt/dtbo.img" \
              "$PRODUCT_DIR/installed-files-ramdisk.txt" \
              "$PRODUCT_DIR/vendor/build.prop" \
              "$PRODUCT_DIR/recovery/root/prop.default"; do
              if [ -f "$file" ]; then
                stat -c '%s bytes | %n' "$file"
              else
                echo "MISSING | $file"
              fi
            done

            echo ""
            echo "Recovery module inventory:"
            MODULE_DIR="$DEVICE_DIRECTORY/$DEVICE_NAME/recovery/root/lib/modules"
            if [ -d "$MODULE_DIR" ]; then
              echo "Module files: $(find "$MODULE_DIR" -maxdepth 1 -type f -name '*.ko' | wc -l)"
              echo "Module load entries: $(wc -l < "$MODULE_DIR/modules.load.recovery" 2>/dev/null || echo 0)"
              du -ch "$MODULE_DIR"/*.ko 2>/dev/null | tail -n 1 || true
            fi

            echo ""
            echo "Largest files in generated recovery ramdisk:"
            if [ -d "$PRODUCT_DIR/recovery/root" ]; then
              find "$PRODUCT_DIR/recovery/root" -type f -printf '%s\t%p\n' \
                | sort -nr | head -n 100
            fi

            echo ""
            echo "Largest installed ramdisk entries:"
            if [ -f "$PRODUCT_DIR/installed-files-ramdisk.txt" ]; then
              sort -nr "$PRODUCT_DIR/installed-files-ramdisk.txt" | head -n 100
            fi

            echo ""
            echo "Generated security patch properties:"
            grep -n 'security_patch' "$PRODUCT_DIR/vendor/build.prop" "$PRODUCT_DIR/recovery/root/prop.default" 2>/dev/null || true
          } > "$REPORT"

          cat "$REPORT"


      - name: 📤 Upload recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shrp-recovery-diagnostics-${{ matrix.target }}-${{ github.run_id }}
          path: |
            shrp-recovery-size-report.txt
            android-recovery/out/target/product/${{ env.DEVICE_NAME }}/ramdisk-recovery.img
            android-recovery/out/target/product/${{ env.DEVICE_NAME }}/installed-files-ramdisk.txt
            android-recovery/out/target/product/${{ env.DEVICE_NAME }}/vendor/build.prop
            android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/prop.default
          if-no-files-found: warn
          retention-days: 7


      # ================================================================
      # BUILD METADATA
      # ================================================================

      - name: 📋 Set build metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            recovery)
              echo "BUILD_TARGET_NAME=recovery" >> "$GITHUB_ENV"
              ;;
            boot)
              echo "BUILD_TARGET_NAME=boot" >> "$GITHUB_ENV"
              ;;
            vendor_boot)
              echo "BUILD_TARGET_NAME=vendor_boot" >> "$GITHUB_ENV"
              ;;
          esac

          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

          echo "::notice::✅ Build metadata configured"


      # ================================================================
      # RELEASE
      # ================================================================

      - name: 📤 Upload build to GitHub Release
        if: success()
        uses: softprops/action-gh-release@master
        with:

          files: |
            android-recovery/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET_NAME }}.img
            android-recovery/out/target/product/${{ env.DEVICE_NAME }}/SHRP*.zip
            android-recovery/out/target/product/${{ env.DEVICE_NAME }}/ramdisk-recovery.*

          name: Unofficial SHRP for ${{ env.DEVICE_NAME }} — ${{ matrix.target }}

          tag_name: shrp-${{ env.BUILD_DATE }}-${{ matrix.target }}

          body: |
            # Unofficial SHRP

            Device: ${{ env.DEVICE_NAME }}

            Target: ${{ matrix.target }}

            Manifest:
            ${{ inputs.MANIFEST }}

            Manifest branch:
            ${{ inputs.MANIFEST_BRANCH }}

            Device Tree:
            ${{ env.DEVICE_TREE }}

            Device Tree Branch:
            ${{ env.DEVICE_TREE_BRANCH }}

            Device Tree Commit:
            ${{ env.COMMIT_ID }}

            Recovery Core:
            ${{ env.RECOVERY_CORE }}

            Recovery Core Branch:
            ${{ env.RECOVERY_CORE_BRANCH }}


      # ================================================================
      # LDCHECK
      # ================================================================

      - name: 🧪 Run LDCheck
        if: ${{ inputs.LDCHECK && success() }}
        shell: bash
        run: |
          set -euo pipefail

          echo "::notice::🧪 Running LDCheck..."

          if [ ! -d "tools" ]; then
            echo "::warning::tools directory does not exist."
            exit 0
          fi

          if [ ! -f "tools/ldcheck" ]; then
            echo "::warning::ldcheck tool not found."
            exit 0
          fi

          if [ ! -f "tools/libneeds" ]; then
            echo "::warning::libneeds not found."
            exit 0
          fi

          ROOT_DIR="${GITHUB_WORKSPACE}/android-recovery/out/target/product/${DEVICE_NAME}/recovery/root"

          mkdir -p "$ROOT_DIR"

          cp \
            tools/libneeds \
            "$ROOT_DIR/"

          cp \
            tools/ldcheck \
            "$ROOT_DIR/"

          cd "$ROOT_DIR"

          chmod +x ldcheck

          python3 ldcheck \
            -p system/lib64:vendor/lib64:system/lib:vendor/lib \
            -d "${{ inputs.LDCHECKPATH }}"

          echo "::notice::✅ LDCheck complete"

        continue-on-error: true


      # ================================================================
      # UPLOAD BUILD LOG
      # ================================================================

      - name: 📤 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shrp-build-log-${{ matrix.target }}-${{ github.run_id }}
          path: |
            shrp-build.log
          if-no-files-found: warn
